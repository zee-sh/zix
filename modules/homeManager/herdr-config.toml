# herdr — managed by zix (modules/homeManager/herdr.nix).
#
# Where this file lives depends on the host. With zix.dotfiles mutable it is a
# symlink into the checkout — edit it directly, no rebuild. Otherwise it is a
# read-only store copy: edit it here and run `darwin-rebuild switch`.
#
# One config file is shared by every herdr session (default/work and personal
# alike) — named sessions get their own sockets, panes, and state, but not their
# own config. Session state lives in ~/.config/herdr/sessions/<name>/.

onboarding = false

[keys]
# Prefix key to enter prefix mode (herdr default: "ctrl+b"). Using "ctrl+s"
# (tmux-style). Note: ctrl+s is XOFF flow-control in most ttys — herdr captures
# the prefix so it normally won't reach the terminal, but if output ever freezes,
# add `stty -ixon` to your shell init.
prefix = "ctrl+s"

# Plugin toggles. The plugin BINARIES are installed imperatively once per machine
# (`herdr plugin install <repo>`); these bindings just invoke their toggle actions.
# reviewr (persiyanov/herdr-reviewr): review the agent's diff, comment, send back.
[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

# file-viewer (smarzban/herdr-file-viewer): git-aware read-only repo browser.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"

[update]
# Disable auto version checks so the client doesn't jump protocol ahead of the
# running server (caused repeated attach failures). Update manually with
# `herdr update`, then restart the server.
version_check = false
manifest_check = false

[theme]
name = "catppuccin"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"

[experimental]
# Replays recent pane contents after a server restart. Pane output is written to
# <session-dir>/session-history.json — one file per session, so work and personal
# screens never commingle. Treat those files like shell history.
pane_history = true
switch_ascii_input_source_in_prefix = true

[advanced]
# Per-pane scrollback buffer, in bytes (default ~10 MB). Bumped to 50 MB.
scrollback_limit_bytes = 50000000
