name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref; a PR only needs its newest commit
# checked. Matters here because the repo is private, so runner time is billed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run on ubuntu-latest deliberately. This repo is private, so Actions
# minutes count against the account quota and macOS runners bill at 10x the rate
# of Linux. Neither check needs macOS: formatting is platform independent, and
# `darwinConfigurations` is a top-level flake output, so it evaluates from Linux
# without instantiating anything for the host platform.
jobs:
  fmt:
    name: nix fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # Deliberately not `nix fmt`: `formatter` is a perSystem output and
      # modules/systems.nix declares only aarch64-darwin, so on Linux that fails
      # with "does not provide attribute 'formatter.x86_64-linux'". Invoking the
      # formatter package directly sidesteps that. `--inputs-from .` resolves it
      # from the flake's own pinned nixpkgs, so CI and local `nix fmt` run the
      # same version.
      #
      # --ci implies --fail-on-change and --no-cache: treefmt formats into the
      # ephemeral checkout and exits non-zero if anything changed, so
      # unformatted code fails rather than being silently rewritten.
      - name: Check formatting
        run: nix run --inputs-from . nixpkgs#nixfmt-tree -- --ci

  eval:
    name: eval darwin configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # Catches broken option references, bad merges and module wiring typos
      # that formatting alone would not. Stops at the derivation; it does not
      # build the closure, so no aarch64-darwin builder is required.
      - name: Evaluate m2air
        run: nix eval --raw .#darwinConfigurations.m2air.system.drvPath

      - name: Evaluate m4max
        run: nix eval --raw .#darwinConfigurations.m4max.system.drvPath
