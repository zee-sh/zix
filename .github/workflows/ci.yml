name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref; a PR only needs its newest commit
# checked. Matters here because the repo is private, so runner time is billed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ubuntu-latest deliberately: this repo is private and macOS runners bill at 10x.
# Neither check needs macOS — formatting is platform independent, and
# darwinConfigurations is a top-level output that evaluates fine from Linux.
jobs:
  fmt:
    name: nix fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # Not `nix fmt`: formatter is a perSystem output and systems.nix declares
      # only aarch64-darwin, so it is absent on Linux. --inputs-from . keeps CI
      # on the same pinned nixpkgs as local. --ci implies --fail-on-change.
      - name: Check formatting
        run: nix run --inputs-from . nixpkgs#nixfmt-tree -- --ci

  eval:
    name: eval darwin configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # Catches broken option references, bad merges and module wiring typos
      # that formatting alone would not. Stops at the derivation; it does not
      # build the closure, so no aarch64-darwin builder is required.
      - name: Evaluate m2air
        run: nix eval --raw .#darwinConfigurations.m2air.system.drvPath

      - name: Evaluate m4max
        run: nix eval --raw .#darwinConfigurations.m4max.system.drvPath
